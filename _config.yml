title: Suomen Jujutsuliitto
description: Suomen Jujutsuliitto – Finnish Jujutsu Federation
lang: fi
url: "https://www.jujutsuliitto.fi"
# Leave empty when the site is served from its own domain (www.jujutsuliitto.fi).
# If it is served from https://<user>.github.io/<repo>/ instead, set this to "/<repo>".
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

