  - /assets/uploads/2020/01/cropped-CJJ60-SJJL40-lmedium.2x.1573408450.jpg
  - /assets/uploads/2020/01/cropped-DSC00667medium.2x.1573386850-1.jpg
  - /assets/uploads/2020/01/cropped-IMG-0516medium.2x.1573391283.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
